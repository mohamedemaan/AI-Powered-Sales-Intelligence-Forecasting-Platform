name: Production CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        
    - name: Run Tests
      run: |
        cd backend
        pytest tests/
        
    - name: Build Docker Images
      run: |
        docker build -t sales-intel-backend ./backend
        docker build -t sales-intel-frontend ./frontend
        docker build -t sales-intel-worker -f ./backend/Dockerfile.worker ./backend

  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
    - name: Check Deployment Configuration
      run: |
        if [ -z "${{ secrets.SERVER_IP }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "DEPLOY_READY=false" >> $GITHUB_ENV
          echo "Deployment secrets (SERVER_IP, SSH_PRIVATE_KEY) not set in repository secrets. Skipping remote SSH deploy."
        else
          echo "DEPLOY_READY=true" >> $GITHUB_ENV
        fi

    - name: Deploy to Server
      if: env.DEPLOY_READY == 'true'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/sales-intel
          git pull origin main
          docker-compose -f docker-compose.yml down
          docker-compose -f docker-compose.yml up -d --build
